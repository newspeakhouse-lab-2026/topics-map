name: Refresh the map

# Daily refresh of the public heart data. Hearts move most days; the embedding
# inputs (titles/bodies) rarely do, so the job re-embeds only when the topic
# content hash changes -- see scripts/fetch.py::report_changes. Nothing is
# committed on a no-op day.
#
# A push made with the default GITHUB_TOKEN does NOT trigger other workflows,
# so this workflow deploys Pages itself instead of relying on pages.yml (which
# still handles human pushes to main).
#
# Privacy: the runner is ephemeral and only data/raw.json (tokens + initials)
# and map.html go back to git. Bodies and the name list stay in data/ and are
# gitignored; build.py's name guard is the backstop.

on:
  schedule:
    - cron: "17 4 * * *"  # 04:17 UTC daily (schedules are best-effort)
  workflow_dispatch:
    inputs:
      force_embed:
        description: Re-embed even if the topic content is unchanged
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-map
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      change: ${{ steps.fetch.outputs.change }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements-embed.txt

      # Anonymous, public data only -- no secrets are needed or used.
      - name: Fetch the graph
        id: fetch
        run: python3 scripts/fetch.py --refresh

      - name: Decide whether there is work to do
        id: gate
        run: |
          change="${{ steps.fetch.outputs.change }}"
          echo "change: $change -- ${{ steps.fetch.outputs.summary }}"
          # A forced embed must override the no-op gate, or a manual re-embed on
          # a quiet day would be silently skipped.
          if [ "$change" = "none" ] && [ "${{ inputs.force_embed }}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Model weights only change with the pinned deps, so they get their own
      # static cache -- a topic edit must not re-download ~90 MB.
      - name: Cache the embedding model
        if: steps.gate.outputs.skip == 'false'
        uses: actions/cache@v4
        with:
          path: |
            data/cache/hf
            data/cache/fastembed
          key: embed-model-${{ runner.os }}-${{ hashFiles('scripts/requirements-embed.txt') }}

      # Keyed on the topic content hash: a heart-only day restores the previous
      # embeddings instead of recomputing them.
      - name: Restore embeddings (keyed on topic content)
        if: steps.gate.outputs.skip == 'false' && inputs.force_embed != true
        uses: actions/cache@v4
        with:
          path: data/embeddings.json
          key: embeddings-${{ runner.os }}-${{ steps.fetch.outputs.semanticKey }}

      - name: Decide whether to embed
        if: steps.gate.outputs.skip == 'false'
        id: embed_gate
        run: |
          if [ "${{ inputs.force_embed }}" = "true" ] || [ ! -f data/embeddings.json ]; then
            echo "need=true" >> "$GITHUB_OUTPUT"
          else
            echo "need=false (embeddings restored from cache)" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the embed stage
        if: steps.embed_gate.outputs.need == 'true'
        run: python3 -m pip install -r scripts/requirements-embed.txt

      - name: Embed topics
        if: steps.embed_gate.outputs.need == 'true'
        run: python3 scripts/embed.py

      - name: Rebuild the artefact
        if: steps.gate.outputs.skip == 'false'
        run: python3 scripts/build.py

      # commit only what build.py has vetted; never `git add -A` (bodies and
      # the name list are gitignored and must not leave the runner).
      - name: Commit data + artefact if changed
        if: steps.gate.outputs.skip == 'false'
        run: |
          if git diff --quiet -- data/raw.json map.html; then
            echo "no diff in raw.json or map.html; nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw.json map.html
          git commit -m "refresh map: ${{ steps.fetch.outputs.summary }}"
          # main may have moved since checkout; rebase over it before pushing.
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main

  # Mirrors pages.yml, but in this run: the bot's own push does not trigger it.
  deploy:
    needs: refresh
    if: needs.refresh.result == 'success' && needs.refresh.outputs.change != 'none'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Stage the single-file site
        run: |
          mkdir -p _site
          cp map.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
